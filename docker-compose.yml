# Default:            docker compose up -d                      -> infrastructure only
# + monitoring:       docker compose --profile monitoring up -d
# + MinIO (S3):       docker compose --profile s3 up -d
# Everything in Docker (cloud): docker compose --profile app --profile monitoring up -d --build

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://asr:asr@postgres:5432/asr
  REDIS_URL: redis://redis:6379/0
  DATA_ROOT: /data
  STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
  S3_BUCKET: ${S3_BUCKET:-asr-audio}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-}
  MODEL_BACKEND: ${MODEL_BACKEND:-stub}
  WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-small}
  WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
  WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
  STUB_SLEEP_SECONDS: ${STUB_SLEEP_SECONDS:-0.5}
  STUB_FAILURE_PROBABILITY: ${STUB_FAILURE_PROBABILITY:-0.05}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: asr
      POSTGRES_PASSWORD: asr
      POSTGRES_DB: asr
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    command: ["postgres", "-c", "max_connections=200"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asr"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]

  # ---------------- optional: S3-compatible storage ----------------
  minio:
    profiles: ["s3"]
    image: minio/minio
    command: server /data --console-address ":9001"
    environment: {MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

  # ---------------- optional: monitoring ----------------
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    ports: ["9090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana
    environment: {GF_SECURITY_ADMIN_PASSWORD: admin}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    ports: ["3000:3000"]
    depends_on: [prometheus]

  node-exporter:
    profiles: ["monitoring"]
    image: prom/node-exporter
    ports: ["9100:9100"]

  # ---------------- optional: the application itself (cloud / all-in-Docker) ----------------
  migrate:
    profiles: ["app"]
    build: .
    environment: *app-env
    command: alembic upgrade head
    depends_on:
      postgres: {condition: service_healthy}

  api:
    profiles: ["app"]
    build: .
    environment: *app-env
    command: gunicorn app.api.main:app -k uvicorn.workers.UvicornWorker -w 4 -b 0.0.0.0:8000
    ports: ["8000:8000"]
    volumes: ["audiodata:/data"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_started}

  worker:
    profiles: ["app"]
    build: .
    environment: *app-env
    command: celery -A app.worker.celery_app:celery_app worker -l info
    volumes: ["audiodata:/data", "hfcache:/root/.cache/huggingface"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_started}

  beat:
    profiles: ["app"]
    build: .
    environment: *app-env
    command: celery -A app.worker.celery_app:celery_app beat -l info
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_started}

  monitor:
    profiles: ["app"]
    build: .
    environment: *app-env
    command: python -m monitor.drift
    ports: ["9102:9102"]
    depends_on:
      migrate: {condition: service_completed_successfully}

volumes:
  pgdata:
  redisdata:
  miniodata:
  promdata:
  grafanadata:
  audiodata:
  hfcache:
